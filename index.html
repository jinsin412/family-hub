<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="결율 Diary">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="./manifest.json?v=20260726-3">
  <link rel="icon" href="./icon.svg?v=20260726-3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg?v=20260726-3">
  <title>결율 Diary</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#fff9f3;color:#3d3540}
    .boot{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 12% 0%,rgba(255,196,208,.35),transparent 30%),radial-gradient(circle at 90% 10%,rgba(201,244,232,.45),transparent 28%),#fff9f3}
    .card{width:min(390px,100%);text-align:center;background:rgba(255,255,255,.86);border:1px solid #f0dfe6;border-radius:26px;padding:34px 24px;box-shadow:0 20px 55px rgba(117,78,96,.14)}
    .logo{width:78px;height:78px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#ff6b81,#ff9e72);color:white;font-size:34px;box-shadow:0 14px 30px rgba(255,107,129,.28)}
    h1{font-size:25px;margin:0 0 9px;color:#ff6b81}p{font-size:14px;line-height:1.6;margin:0;color:#74656d}.spin{width:26px;height:26px;border:3px solid #ffe0e7;border-top-color:#ff6b81;border-radius:50%;margin:24px auto 0;animation:r .75s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    .error{display:none;margin-top:20px;padding:14px;border-radius:14px;background:#fff0ee;color:#93000a;font-size:14px;line-height:1.55}.retry{display:none;margin:16px auto 0;border:0;border-radius:14px;padding:12px 18px;background:#ff6b81;color:#fff;font-weight:700;font-size:15px}
  </style>
</head>
<body>
  <main class="boot">
    <section class="card">
      <div class="logo">♡</div>
      <h1>결율 Diary</h1>
      <p id="status">앱을 안전하게 불러오고 있습니다.</p>
      <div id="spinner" class="spin"></div>
      <div id="error" class="error"></div>
      <button id="retry" class="retry" type="button">다시 불러오기</button>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const VERSION = '20260726-3';
  const LEGACY_COMMIT = 'b9842f5c8b43db9b3ec55033d02d07400ca284e3';
  const sources = [
    `https://raw.githubusercontent.com/jinsin412/family-hub/${LEGACY_COMMIT}/index.html`,
    `https://cdn.jsdelivr.net/gh/jinsin412/family-hub@${LEGACY_COMMIT}/index.html`
  ];

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');
  const errorEl = document.getElementById('error');
  const retryEl = document.getElementById('retry');

  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('연결 시간 초과')), ms))
    ]);
  }

  async function fetchLegacy() {
    let lastError;
    for (const url of sources) {
      try {
        const response = await withTimeout(fetch(`${url}?v=${VERSION}`, { cache:'no-store', mode:'cors' }), 12000);
        if (!response.ok) throw new Error(`원본 앱 응답 오류 (${response.status})`);
        const html = await response.text();
        if (!html.includes('결율 Diary') || !html.includes('firebaseConfig')) throw new Error('원본 앱 파일 검증 실패');
        return html;
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error('앱 파일을 불러오지 못했습니다');
  }

  function patchHtml(html) {
    let patched = html;

    // Firebase Hosting 루트와 GitHub Pages 하위 경로 모두에서 동작하도록 보정합니다.
    patched = patched.split("navigator.serviceWorker.register('/sw.js', { scope: '/' })")
      .join("navigator.serviceWorker.register(new URL('sw.js', document.baseURI).href, { scope: './' })");
    patched = patched.split("navigator.serviceWorker.register('/firebase-messaging-sw.js')")
      .join("navigator.serviceWorker.register(new URL('firebase-messaging-sw.js', document.baseURI).href, { scope: './' })");

    const oldAuth = `onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    await initUserProfile(user);
    showApp();
    await loadFamilyData();
  } else {
    currentUser = null;
    familyId = null;
    hideApp();
  }
});`;

    const safeAuth = `const __dalkongTimeout = (promise, ms, label) => Promise.race([
  promise,
  new Promise((_, reject) => setTimeout(() => reject(new Error(label)), ms))
]);

onAuthStateChanged(auth, async user => {
  if (!user) {
    currentUser = null;
    familyId = null;
    hideApp();
    return;
  }

  currentUser = user;
  showApp();

  try {
    await __dalkongTimeout(initUserProfile(user), 12000, '사용자 정보 연결 시간 초과');
    if (familyId) {
      __dalkongTimeout(loadFamilyData(), 15000, '가족 데이터 연결 시간 초과')
        .catch(error => {
          console.error('[Family bootstrap]', error);
          showToast('가족 데이터 연결이 지연되고 있습니다. 잠시 후 다시 열어 주세요.');
        });
    }
  } catch (error) {
    console.error('[Auth bootstrap]', error);
    familyId = null;
    showToast('로그인은 확인됐지만 데이터 연결이 지연되고 있습니다.');
  }
});`;

    if (patched.includes(oldAuth)) patched = patched.replace(oldAuth, safeAuth);

    patched = patched
      .replace('href="manifest.json"', `href="./manifest.json?v=${VERSION}"`)
      .replaceAll('href="icon.svg"', `href="./icon.svg?v=${VERSION}"`)
      .replace('</head>', `<meta data-dalkong-hotfix="${VERSION}" http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>\n</head>`);

    return patched;
  }

  async function boot() {
    statusEl.textContent = '최신 앱 파일을 확인하고 있습니다.';
    spinnerEl.style.display = 'block';
    errorEl.style.display = 'none';
    retryEl.style.display = 'none';

    try {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(reg => !reg.active || !reg.active.scriptURL.includes('/sw.js'))
            .map(reg => reg.unregister()));
        } catch (_) {}
      }

      const original = await fetchLegacy();
      const patched = patchHtml(original);
      document.open();
      document.write(patched);
      document.close();
    } catch (error) {
      console.error('[Dalkong bootstrap]', error);
      spinnerEl.style.display = 'none';
      errorEl.textContent = `앱 파일을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요. (${error.message})`;
      errorEl.style.display = 'block';
      retryEl.style.display = 'inline-block';
    }
  }

  retryEl.addEventListener('click', () => location.reload());
  boot();
})();
</script>
</body>
</html>
